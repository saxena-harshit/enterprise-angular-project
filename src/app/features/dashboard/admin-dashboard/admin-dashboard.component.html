

<mat-form-field>
  <mat-label>Select</mat-label>
  <mat-select [(ngModel)]="selectedValue" (selectionChange)="loadComponent()">
    <mat-option *ngFor="let value of options" [value]="value">
      {{value}}
    </mat-option>
  </mat-select>
</mat-form-field>

<ng-container #container></ng-container>
